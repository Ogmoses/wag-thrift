<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bank Transfers – WAG Admin</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/admin.js"></script>
</head>
<body>

<div id="adminShellRoot"></div>

<div id="appShell">
  <main class="main-content" id="mainContent">

    <!-- BANK TRANSFERS -->
    <div class="page active" id="page-transfers">
      <div class="page-inner">
        <div class="section-card">
          <div class="section-card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            Pending Bank Transfers
          </div>
          <p style="color:var(--sub);font-size:12.5px;margin:-4px 0 14px;">Bank transfers submitted by field agents do not count toward a customer's balance until confirmed here against the actual bank statement.</p>
          <div id="transfersList"><div class="empty-state">Loading…</div></div>
        </div>
      </div>
    </div>

  </main>
</div>

<script>
const _a = requireAdmin();
if (_a) (async () => {
  initAdminTheme();
  renderAdminShell('transfers', 'Bank Transfers');

  const [valid] = await Promise.all([
    verifyAdminFromDB(),
    renderTransfersPage().catch(e => console.error('Admin transfers render error:', e)),
  ]);
  if (!valid) { window.location.replace(rootPath() + 'admin/login.html'); return; }
  closeSidebar();
})();
</script>
</body>
</html>
