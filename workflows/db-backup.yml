name: Daily Database Backup

on:
  schedule:
    # Runs every day at 2:00 AM UTC. Adjust the cron if you want a
    # different time — minute hour day month weekday.
    - cron: '0 2 * * *'
  workflow_dispatch: {}  # lets you manually trigger a backup anytime from
                          # the Actions tab on GitHub, no waiting for 2am

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz
          sudo mv supabase /usr/local/bin/supabase
          supabase --version

      - name: Install AWS CLI (used for Cloudflare R2 — S3-compatible)
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install
          aws --version

      - name: Dump database
        env:
          # Repo secret — Supabase Dashboard -> Project Settings -> Database
          # -> Connection string -> URI (Session pooler or Direct connection).
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p /tmp/backups
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "/tmp/backups/backup_${TIMESTAMP}.sql"
          echo "BACKUP_FILE=/tmp/backups/backup_${TIMESTAMP}.sql" >> $GITHUB_ENV
          echo "BACKUP_NAME=backup_${TIMESTAMP}.sql" >> $GITHUB_ENV

      - name: Upload to Cloudflare R2 (private bucket — NOT the public repo)
        env:
          # All four are repo secrets — see R2_BACKUP_SETUP.md for how to
          # get these values from your Cloudflare account.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/$BACKUP_NAME" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Prune backups older than 30 days from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%s 2>/dev/null || date -v-30d +%s)
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT" | while read -r line; do
            FILE_DATE=$(echo "$line" | awk '{print $1" "$2}')
            FILE_NAME=$(echo "$line" | awk '{print $4}')
            FILE_EPOCH=$(date -d "$FILE_DATE" +%s 2>/dev/null || date -j -f '%Y-%m-%d %H:%M:%S' "$FILE_DATE" +%s 2>/dev/null || echo 0)
            if [ "$FILE_EPOCH" -lt "$CUTOFF" ] && [ -n "$FILE_NAME" ]; then
              aws s3 rm "s3://$R2_BUCKET/$FILE_NAME" --endpoint-url "$R2_ENDPOINT"
            fi
          done
