<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Streaks & Calendar – WAG Enterprises</title>
<link rel="stylesheet" href="../css/shared.css?v=cal5">
<style>
.cal-nav-btn{width:30px!important;height:30px!important;min-width:30px!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:0!important;font-size:20px!important;line-height:1!important;background:var(--border)!important;border:none!important;cursor:pointer!important;flex-shrink:0!important;}
body.dark .cal-nav-btn{background:#2a2a2a!important;color:#f0f0f0!important;}
.mini-cal-month-lbl{flex:1!important;text-align:center!important;padding:0!important;font-size:15px!important;font-weight:800!important;}
.mini-cal-hdr{display:flex!important;align-items:center!important;gap:6px!important;margin-bottom:16px!important;}
</style>
<link rel="stylesheet" href="../css/customer.css">
<link rel="stylesheet" href="../css/polish.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/customer.js"></script>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
 <div class="loading-spinner"></div>
 <div class="loading-text" id="loadingText">Please wait…</div>
</div>

<div class="subpage active" id="custCalSubpage" style="position:relative;min-height:100vh;">
 <div class="dash-header">
  <button onclick="window.location.href='dashboard.html'" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;margin-right:8px;">←</button>
  <div class="hdr-info"><div class="hdr-name">Streaks &amp; Calendar</div><div class="hdr-sub" id="calActivePlanName">—</div></div>
 </div>

 <div class="plan-tabs-bar" id="calPlanTabsBar"></div>

 <div id="calNoPlanMsg" class="no-plan" style="display:none;">
  <div class="no-plan-ico"></div>
  <div style="font-size:16px;font-weight:700;margin-bottom:7px;">No savings plans yet</div>
  <div style="font-size:12px;color:var(--sub);">Start a plan on the Home tab to begin your streak</div>
 </div>

 <div id="calStandaloneContent" style="display:none;padding-top:14px;padding-bottom:110px;">

  <!-- Full calendar — now the primary, large focal element of this tab -->
  <div class="cal-standalone-wrap cal-big">
   <div class="wcard" style="padding:18px;">
    <div class="mini-cal-hdr">
     <button class="cal-nav-btn" onclick="prevCalMonth()">&#8249;</button>
     <span class="mini-cal-month-lbl" id="calMonthLbl">—</span>
     <button class="cal-nav-btn" onclick="nextCalMonth()">&#8250;</button>
    </div>
    <div class="mini-cal-days-hdr" id="calDaysHdr"></div>
    <div id="calGrid"></div>
    <div class="cal-legend">
     <div class="cal-legend-item"><span class="cal-dot" style="background:#d1fae5;"></span>Paid</div>
     <div class="cal-legend-item"><span class="cal-dot" style="background:#fee2e2;"></span>Missed</div>
     <div class="cal-legend-item"><span class="cal-dot" style="background:#fef3c7;border:1px solid #f59e0b;"></span>Payout</div>
    </div>
   </div>
  </div>

  <!-- Streak ring — signature visual, now below the calendar -->
  <div class="streak-ring-card">
   <div class="streak-ring-wrap">
    <svg class="streak-ring-svg" viewBox="0 0 128 128">
     <circle class="streak-ring-bg" cx="64" cy="64" r="57.5"></circle>
     <circle class="streak-ring-fg" id="streakRingFg" cx="64" cy="64" r="57.5"></circle>
    </svg>
    <div class="streak-ring-center">
     <div class="streak-ring-num" id="streakRingNum">0</div>
     <div class="streak-ring-lbl">Day Streak</div>
    </div>
   </div>
   <div class="streak-ring-sub">Keep paying daily to grow your streak toward a <span class="streak-ring-goal">30-day</span> milestone</div>
  </div>

  <!-- Streak stats -->
  <div class="streak-stats-row">
   <div class="streak-card"><div class="sv" id="streakCurrentVal">0</div><div class="sl">Current Streak</div></div>
   <div class="streak-card"><div class="sv" id="streakLongestVal">0</div><div class="sl">Longest Streak</div></div>
  </div>
  <div class="streak-stats-row" style="grid-template-columns:1fr;">
   <div class="streak-card"><div class="sv" id="streakTotalVal">0</div><div class="sl">Total Days Paid</div></div>
  </div>

 </div>

 <nav class="bnav visible" style="position:fixed;">
  <button class="bnav-tab" onclick="window.location.href='dashboard.html'">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
   Home
  </button>
  <button class="bnav-tab" onclick="window.location.href='transactions.html'">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
   Savings History
  </button>
  <button class="bnav-tab active">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
   Streaks
  </button>
  <button class="bnav-tab" onclick="window.location.href='settings.html'">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
   Profile
  </button>
 </nav>
</div>

<script>
requireRole(['customer']);
initTheme();
(async () => {
  const [valid] = await Promise.all([
    verifyRoleFromDB('customer'),
    loadCalendarPage().catch(e => console.error('Calendar render error:', e)),
  ]);
  if (!valid) { window.location.replace(rootPath() + 'login.html'); return; }
  startSuspendCheck();
  enforcePaymentPinSetup();
})();
</script>
</body>
</html>
