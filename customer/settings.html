<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Settings – WAG Enterprises</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/customer.css">
<link rel="stylesheet" href="../css/polish.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/customer.js"></script>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
 <div class="loading-spinner"></div>
 <div class="loading-text" id="loadingText">Please wait…</div>
</div>

<div class="subpage active" id="custProfileSubpage" style="position:relative;min-height:100vh;">
 <div class="dash-header">
  <button onclick="window.location.href='dashboard.html'" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;margin-right:8px;">←</button>
  <div class="hdr-info"><div class="hdr-name">Settings</div></div>
 </div>
 <div id="custProfileContent" style="padding:13px 13px 90px;"></div>
 <nav class="bnav visible" style="position:fixed;">
  <button class="bnav-tab" onclick="window.location.href='dashboard.html'">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
   Home
  </button>
  <button class="bnav-tab" onclick="window.location.href='transactions.html'">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
   Savings History
  </button>
  <button class="bnav-tab" onclick="window.location.href='calendar.html'">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
   Streaks
  </button>
  <button class="bnav-tab active">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
   Profile
  </button>
 </nav>
</div>

<div id="addEmailModal" class="modal"><div class="msheet" style="max-width:480px;position:relative;"><button class="m-close" onclick="closeModal('addEmailModal')">×</button><div class="m-handle"></div><div class="m-title">Email Address</div><p style="color:var(--sub);font-size:13px;margin-bottom:14px;">Optional — add this if you'd like to receive account notifications by email.</p><div class="mform-group"><label class="form-lbl">Email Address</label><input type="email" id="addEmailInp" class="form-inp" placeholder="you@example.com"></div><div id="addEmailMsg"></div><button class="btn btn-blue" style="margin-top:8px;" onclick="saveAddEmail()">Save Email</button></div></div>

<div id="addAddressModal" class="modal"><div class="msheet" style="max-width:480px;position:relative;"><button class="m-close" onclick="closeModal('addAddressModal')">×</button><div class="m-handle"></div><div class="m-title">Home Address</div><p style="color:var(--sub);font-size:13px;margin-bottom:14px;">Optional — add this if you'd like it on file.</p><div class="mform-group"><label class="form-lbl">Address</label><input type="text" id="addAddressInp" class="form-inp" placeholder="Your residential address"></div><div id="addAddressMsg"></div><button class="btn btn-blue" style="margin-top:8px;" onclick="saveAddAddress()">Save Address</button></div></div>

<script>
requireRole(['customer']);
initTheme();
// buildCustProfilePage() only reads the already-cached local profile — no
// network wait needed — so it can render instantly while the fresh
// security check happens in the background.
buildCustProfilePage();
verifyRoleFromDB('customer').then(valid => {
  if (!valid) { window.location.replace(rootPath() + 'login.html'); return; }
  startSuspendCheck();
  enforcePaymentPinSetup();
});
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m && m.id !== 'payPinSetupModal') m.classList.remove('active'); }));
</script>
</body>
</html>
