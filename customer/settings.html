<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Settings – WAG Enterprises</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/customer.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/customer.js"></script>
<style>
body{background:#f0f3f8;}
body.dark{background:#0d0d0f;}
.bnav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:none;border-radius:28px;display:none;align-items:center;z-index:500;height:56px;padding:0 8px;gap:4px;box-shadow:0 8px 32px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.1);width:calc(100% - 48px);max-width:380px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
body.dark .bnav{background:rgba(22,22,26,.95);box-shadow:0 8px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);}
.bnav.visible{display:flex;}
.bnav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;cursor:pointer;padding:8px 6px;color:#aaa;font-size:9px;font-weight:700;letter-spacing:.3px;border-radius:22px;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent;text-decoration:none;min-height:44px;}
.bnav-tab svg{flex-shrink:0;transition:stroke .2s;}
.bnav-tab.active{color:#fff;background:var(--blue);}
body.dark .bnav-tab.active{color:#111;background:var(--yellow);}
body.dark .bnav-tab.active svg{stroke:#111;}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
 <div class="loading-spinner"></div>
 <div class="loading-text" id="loadingText">Please wait…</div>
</div>

<div class="subpage active" id="custProfileSubpage" style="position:relative;min-height:100vh;">
 <div class="dash-header">
  <button onclick="window.location.href='dashboard.html'" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;margin-right:8px;">←</button>
  <div class="hdr-info"><div class="hdr-name">Settings</div></div>
 </div>
 <div id="custProfileContent" style="padding:13px 13px 90px;"></div>
 <nav class="bnav visible">
  <button class="bnav-tab" onclick="window.location.href='dashboard.html'">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
   Home
  </button>
  <button class="bnav-tab" onclick="window.location.href='transactions.html'">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
   Transactions
  </button>
  <button class="bnav-tab active">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
   Profile
  </button>
 </nav>
</div>

<script>
requireRole(['customer']);
initTheme();
verifyRoleFromDB('customer').then(valid => {
  if (!valid) return window.location.replace(rootPath() + 'login.html');
  buildCustProfilePage();
  startSuspendCheck();
});
</script>
</body>
</html>
