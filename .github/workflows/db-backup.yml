name: Daily Database Backup

# Runs automatically every day at 2 AM UTC, and can also be triggered
# manually from the Actions tab (Run workflow button) for testing.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client (for pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Install AWS CLI (R2 is S3-compatible)
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Dump the Supabase database
        env:
          PGCONNECT_TIMEOUT: '30'
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          echo "BACKUP_FILE=backup_${TIMESTAMP}.sql" >> "$GITHUB_ENV"
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-privileges --format=plain \
            --file="backup_${TIMESTAMP}.sql"

      - name: Upload backup to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://${{ secrets.R2_BUCKET_NAME }}/$BACKUP_FILE" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"

      - name: Delete backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-30d +%Y-%m-%d)
          aws s3 ls "s3://${{ secrets.R2_BUCKET_NAME }}/" --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
          | awk '{print $4}' \
          | grep '^backup_' \
          | while read -r FILE; do
              FILE_DATE=$(echo "$FILE" | sed -E 's/^backup_([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/')
              if [[ "$FILE_DATE" < "$CUTOFF" ]]; then
                echo "Deleting old backup: $FILE"
                aws s3 rm "s3://${{ secrets.R2_BUCKET_NAME }}/$FILE" --endpoint-url "${{ secrets.R2_ENDPOINT }}"
              fi
            done

      - name: Clean up local file
        if: always()
        run: rm -f "$BACKUP_FILE"
