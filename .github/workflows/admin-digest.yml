name: Cumulative Logbook Report

# Cumulative Monthly Customer Ledger Grid, Monday through Friday at 9:00 PM
# WAT (West Africa Time, UTC+1) — no report on Saturday/Sunday, since the
# organization only operates Monday-Friday. Replaces the old separate
# daily/weekly Cash Report schedule: there's now a single report type, so
# there's a single schedule.
#
# 20:00 UTC = 21:00 WAT exactly (no DST in Nigeria, so this offset never
# drifts). Can also be triggered manually from the Actions tab for testing.
#
# NOTE on timing: GitHub's own docs warn that scheduled workflows "may be
# delayed during periods of high load," worst right at the top of the
# hour, since that's when most other repos' cron jobs also fire. This is
# scheduled exactly on the hour anyway because the business asked for a
# specific, quotable send time (9:00 PM WAT) rather than day-level
# freshness — if delivery time needs to be reliable to the minute, this
# needs to move to a real scheduler (e.g. a Cloudflare Cron Trigger
# calling the existing /api/send-digest-now endpoint) instead of GitHub
# Actions cron, which has no exact-time SLA.
on:
  schedule:
    - cron: '0 20 * * 1-5'   # Mon-Fri, 20:00 UTC = 9:00 PM WAT
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF library
        run: npm install pdf-lib

      - name: Generate and send cumulative logbook
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: node .github/scripts/generate-report.js
