name: Admin Activity Digest

# Daily summary every day at 7 AM UTC, plus a weekly rollup every Monday
# at 7:30 AM UTC. Both can also be triggered manually from the Actions tab
# for testing — pick "daily" or "weekly" from the dropdown.
on:
  schedule:
    - cron: '0 7 * * *'      # every day, 7:00 AM UTC
    - cron: '30 7 * * 1'     # Mondays, 7:30 AM UTC (weekly rollup)
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report type to send'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine report type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.report_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * 1" ]; then
            echo "type=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "type=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PDF library
        run: npm install pdf-lib

      - name: Generate and send report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: node .github/scripts/generate-report.js ${{ steps.type.outputs.type }}
